services:
  tank:
    build:
      context: .
      args:
        OBFUSCATE_CLIENT: "${OBFUSCATE_CLIENT:-true}"
    image: tiger-field-trial:local
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      MAX_ROOMS: "${MAX_ROOMS:-16}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      REDIS_URL: "${REDIS_URL:-}"
      REDIS_PREFIX: "${REDIS_PREFIX:-tiger:rooms:v11}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
