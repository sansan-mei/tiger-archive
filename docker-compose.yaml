services:
  tank:
    container_name: "tank"
    platform: linux/amd64
    image: "${TANK_IMAGE:-1596944197/tank:latest}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OBFUSCATE_CLIENT: "${OBFUSCATE_CLIENT:-true}"
    restart: always
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      MAX_ROOMS: "${MAX_ROOMS:-16}"
      WS_COMPRESSION: "${WS_COMPRESSION:-true}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      REDIS_PREFIX: "${REDIS_PREFIX:-tiger:rooms:production}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: "${REDIS_NETWORK:-tank_default}"
    external: ${REDIS_NETWORK_EXTERNAL:-false}
